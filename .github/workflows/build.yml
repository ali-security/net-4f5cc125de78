# Upstream golang.org/x/net has no GitHub Actions CI (it is tested by the Go
# project's own build dashboard / LUCI builders), so this workflow is authored
# for the sealing pipeline. It reproduces the project's own commands: the module
# source zip that proxy.golang.org serves, plus `go build ./...` and
# `go test ./...` over the whole module.
name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Space-separated Go test names to run instead of the full suite
        required: false
        default: ""

permissions:
  contents: read

# No registry time machine here: the Seal Go proxy does not resolve from public
# GitHub runners, and it is not needed — go.mod/go.sum pin every dependency of
# this module to an exact version and hash, and the zip helper's own dependency
# is pinned below to the last golang.org/x/mod release before v0.45.0 shipped.
env:
  GOTOOLCHAIN: auto
  GOFLAGS: -buildvcs=false

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # go.mod's `go 1.24.0` is the module's MINIMUM, not the toolchain the
      # release was tested with. Most of http2's and internal/http3's tests are
      # gated `//go:build go1.25 || goexperiment.synctest`, so on 1.24 they are
      # silently compiled out (`ok golang.org/x/net/http2 0.009s`). Go 1.25.1 is
      # the last release before v0.45.0 shipped and runs them.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Report toolchain
        run: go version && go env GOVERSION GOPROXY

      # Stage a copy of the module tree BEFORE anything writes into the
      # workspace, and drop .github/: upstream ships no .github, so neither this
      # workflow nor the zip helper may become members of the module zip.
      - name: Stage module tree
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/modsrc"
          cp -a "${GITHUB_WORKSPACE}/." "${RUNNER_TEMP}/modsrc/"
          rm -rf "${RUNNER_TEMP}/modsrc/.git" "${RUNNER_TEMP}/modsrc/.github"

      - name: Pack module zip
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/zipper" "${GITHUB_WORKSPACE}/build_output"
          cp "${GITHUB_WORKSPACE}/.github/zipper/create_mod.go" "${RUNNER_TEMP}/zipper/"
          cd "${RUNNER_TEMP}/zipper"
          go mod init example.com/zipper
          go get golang.org/x/mod@v0.28.0
          go run ./create_mod.go golang.org/x/net v0.45.0 "${RUNNER_TEMP}/modsrc" "${GITHUB_WORKSPACE}/build_output/v0.45.0.zip"
          unzip -l "${GITHUB_WORKSPACE}/build_output/v0.45.0.zip" | head -40

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -eo pipefail
          FILTER="${{ inputs.test-filter }}"
          if [ -n "$FILTER" ]; then
            go test -v -run "^($(echo "$FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee /tmp/scoped.log
            for t in $FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" /tmp/scoped.log || {
                echo "selected test ${t} never ran"; exit 1; }
            done
          else
            go test ./...
          fi

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: build_output/v0.45.0.zip
          if-no-files-found: error
